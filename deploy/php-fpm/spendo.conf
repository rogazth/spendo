[spendo]
user = spendo
group = spendo
listen = /run/php/php8.4-fpm-spendo.sock
listen.owner = vito
listen.group = vito
listen.mode = 0660

; Personal app on a small VPS: few workers, spawned on demand.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[open_basedir] = /srv/spendo:/tmp:/usr/share/php
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[memory_limit] = 256M
