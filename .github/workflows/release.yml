name: release

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Build assets
        run: |
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Package release
        id: package
        run: |
          tag="build-$(date -u +%Y%m%d%H%M%S)-${HEAD_SHA:0:7}"
          echo "${tag}" > RELEASE
          rm -rf .env node_modules tests .git .github
          tar -czf /tmp/spendo.tar.gz .
          mv /tmp/spendo.tar.gz spendo.tar.gz
          sha256sum spendo.tar.gz > spendo.tar.gz.sha256
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" spendo.tar.gz spendo.tar.gz.sha256 \
            --target "$SHA" --title "$TAG" --notes "Build of ${SHA}" --latest

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | tail -n +11 \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
